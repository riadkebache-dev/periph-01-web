<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÉRIPH-01 | Service VTC & Transferts Aéroports / Gares</title>
    <style>
        :root {
            --bg-color: #111110;
            --card-bg: #1c1c1a;
            --text-color: #e0e0dc;
            --accent-yellow: #d4af37;
            --border-color: #333330;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: monospace, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 20px;
        }

        .logo-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 0.9rem;
            color: #888;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--accent-yellow);
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
        }

        .vehicle-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .vehicle-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 4px;
        }

        .vehicle-img {
            width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
            margin-bottom: 15px;
        }

        .btn-tactical {
            display: block;
            width: 100%;
            background-color: var(--accent-yellow);
            color: #111;
            text-align: center;
            padding: 12px 0;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .btn-tactical:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-row">
                <span class="logo">PERIPH-01</span>
                <span class="flag">🇫🇷</span>
            </div>
            <div class="tagline">VTC • TRANSFERTS AÉROPORTS & GARES</div>
        </header>

        <div class="section-title">NOS VECTEURS D'INTERVENTION</div>

        <div class="vehicle-stack">
            <!-- VECTEUR 01 : Corolla -->
            <div class="vehicle-box">
                <img src="Corolla.jpg" alt="Vecteur 01 Corolla (Simulation)" class="vehicle-img">
                <a href="#" class="btn-tactical">EXTRACTION VTC</a>
            </div>

            <!-- VECTEUR 02 : Mash -->
            <div class="vehicle-box">
                <img src="Mash.jpg" alt="Vecteur 02 Mash 250 (Simulation)" class="vehicle-img">
                <a href="#" class="btn-tactical">LIVRAISON COLIS</a>
            </div>
        </div>
    </div>

</body>
</html>
